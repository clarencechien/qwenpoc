<p class="eyebrow">差距三 · D2 空機房佈局設計</p>
<h2 class="title">都沒違反規則，但 Opus 多放 26 櫃</h2>
</div>
<div class="figs">
<div class="fig">
<img src="/_blob/a93690d2048f5797bc8dcffab3c0c363" alt="Opus 的佈局設計，南北向機櫃列填滿 L 形機房">
<p class="cap"><b>Opus 243 櫃</b>（基準的 97.2%）：南北向的列，L 形兩翼都用滿。用時 12 分鐘。</p>
</div>
<div class="fig">
<img src="/_blob/8cc30fc7405e278ebf1ef71dcd834339" alt="Qwen 的佈局設計，東西向機櫃列，北側空著">
<p class="cap"><b>Qwen 217 櫃</b>（基準的 86.8%）：東西向的列，北側整條空間沒用到。用時 43 分鐘。</p>
</div>
</div>
<p class="small">9 條規則：不出牆、不重疊、前後維修空間、冷熱通道、空調出風、門口動線、走道可達、GPU 櫃靠近空調。基準 250 櫃是我們的求解器找到的最好結果。</p>
<aside>兩邊 0 違規，8 台 GPU 櫃都正確。差距在空間利用率：機櫃佔地 Opus 177 平方公尺、Qwen 158 平方公尺。</aside>
